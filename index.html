<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>점자 변환 시스템</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f0f0f0; line-height: 1.6; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        h2 { color: #333; font-size: 24px; font-weight: bold; }
        h3 { color: #555; font-size: 18px; font-weight: bold; margin-top: 20px; }

        video, canvas, img { width: 100%; border-radius: 10px; margin-top: 10px; display: none; }
        #video { display: block; }

        .button-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        button { padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        
        #connectBtn { background-color: #007bff; color: white; }
        #captureBtn { background-color: #28a745; color: white; }
        
        #status { margin-top: 20px; padding: 15px; border-radius: 10px; background: #eee; font-size: 14px; text-align: left; word-break: break-all; }
        .highlight { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>점자 단말기 제어 시스템</h2>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="photo" alt="촬영된 사진">

    <div class="button-group">
        <button id="connectBtn">기기 블루투스 연결</button>
        <button id="captureBtn">사진 촬영 및 전송</button>
    </div>

    <h3>현재 상태</h3>
    <div id="status">연결 대기 중...</div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const photo = document.getElementById('photo');
    const status = document.getElementById('status');
    const connectBtn = document.getElementById('connectBtn');
    const captureBtn = document.getElementById('captureBtn');

    let bluetoothDevice;
    let brailleCharacteristic;

    // 서버 주소 (ngrok 주소나 노트북 아이피 주소를 입력하세요)
    const SERVER_URL = "https://hesitant-acorn-anywhere.ngrok-free.dev/upload-image";

    // 카메라 시작
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
        } catch (err) {
            status.innerText = "카메라를 켤 수 없습니다: " + err.message;
        }
    }

    // 블루투스 연결
    connectBtn.addEventListener('click', async () => {
        try {
            status.innerText = "기기 검색 중...";
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ services: [0xFFE0] }] // HM-10 모듈 표준 서비스
            });
            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(0xFFE0);
            brailleCharacteristic = await service.getCharacteristic(0xFFE1);
            
            status.innerText = "✅ 기기 연결 성공!";
            connectBtn.style.backgroundColor = "#6c757d";
            connectBtn.innerText = "연결 완료";
        } catch (err) {
            status.innerText = "❌ 연결 실패: " + err.message;
        }
    });

    // 사진 촬영 및 서버 전송
    captureBtn.addEventListener('click', async () => {
        if (!brailleCharacteristic) {
            alert("먼저 기기를 연결해주세요.");
            return;
        }

        status.innerText = "📸 사진 분석 중...";
        
        // 사진 캡처
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('file', blob, 'capture.jpg');

            try {
                // 파이썬 서버로 데이터 전송
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: {
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: formData
                });
                const result = await response.json();

                if (result.status === "성공") {
                    const text = result.extracted_text;
                    const signals = result.braille_signals; // 서버에서 리스트로 보내준다고 가정

                    status.innerHTML = `인식된 글자: <span class="highlight">${text}</span><br>전송 중...`;

                    // 아두이노로 점자 데이터 전송 (순차적 전송)
                    for (const signal of signals) {
                        const encoder = new TextEncoder();
                        await brailleCharacteristic.writeValue(encoder.encode(signal + "\n"));
                        await new Promise(resolve => setTimeout(resolve, 400)); // 진동을 느낄 수 있도록 1.5초 간격
                    }
                    status.innerHTML += "<br>✅ 모든 데이터 전송 완료!";
                }
            } catch (err) {
                status.innerText = "❌ 서버 통신 오류: " + err.message;
            }
        }, 'image/jpeg');
    });

    initCamera();
</script>

</body>
</html>
